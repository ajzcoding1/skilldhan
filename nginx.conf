# Nginx Reverse Proxy Configuration for AWS EC2
# Place this at: /etc/nginx/sites-available/mydigitalstore
# Link to: ln -s /etc/nginx/sites-available/mydigitalstore /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your EC2 Elastic IP or Domain

    # Redirect all HTTP requests to HTTPS (Enabled automatically by Certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    client_max_body_size 20M;
}
