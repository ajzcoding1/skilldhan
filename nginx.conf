# Nginx Reverse Proxy Configuration for AWS EC2
# Place this at: /etc/nginx/sites-available/skilldhan
# Link to: ln -s /etc/nginx/sites-available/skilldhan /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name skilldhan.shop www.skilldhan.shop;

    return 301 https://skilldhan.shop$request_uri;
}

server {
    listen 443 ssl;
    server_name skilldhan.shop www.skilldhan.shop;

    ssl_certificate /etc/letsencrypt/live/skilldhan.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skilldhan.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    client_max_body_size 20M;
}
